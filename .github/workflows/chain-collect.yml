name: AtlasWatch chain collection

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: atlaswatch-chain-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Collect chain facts and outcomes
        env:
          COLLECTOR_SECRET: ${{ secrets.ATLASWATCH_COLLECTOR_SECRET }}
          SITES_BYPASS_TOKEN: ${{ secrets.ATLASWATCH_SITES_BYPASS_TOKEN }}
        run: |
          test -n "$COLLECTOR_SECRET"
          test -n "$SITES_BYPASS_TOKEN"
          curl --fail --show-error --silent \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 480 \
            --request POST \
            --header "Authorization: Bearer $COLLECTOR_SECRET" \
            --header "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"solanaTargets":[]}' \
            "https://atlaswatch-intelligence.mugger-galas-5ruxfot.chatgpt.site/api/jobs/collect"
