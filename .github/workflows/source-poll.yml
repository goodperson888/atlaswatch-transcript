name: AtlasWatch source polling

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: atlaswatch-source-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Wake transcript sidecar
        run: |
          curl --fail --show-error --silent \
            --retry 4 --retry-delay 15 --retry-all-errors \
            --max-time 120 \
            "https://atlaswatch-transcript.onrender.com/health"

      - name: Poll AtlasWatch sources
        env:
          COLLECTOR_SECRET: ${{ secrets.ATLASWATCH_COLLECTOR_SECRET }}
          SITES_BYPASS_TOKEN: ${{ secrets.ATLASWATCH_SITES_BYPASS_TOKEN }}
        run: |
          test -n "$COLLECTOR_SECRET"
          test -n "$SITES_BYPASS_TOKEN"
          curl --fail --show-error --silent \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 300 \
            --request POST \
            --header "Authorization: Bearer $COLLECTOR_SECRET" \
            --header "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN" \
            "https://atlaswatch-intelligence.mugger-galas-5ruxfot.chatgpt.site/api/jobs/sources"
