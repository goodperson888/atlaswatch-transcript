name: AtlasWatch source polling

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "app.py"
      - "requirements.txt"
      - "Dockerfile"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: atlaswatch-source-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Wake transcript sidecar
        run: |
          curl --fail --show-error --silent \
            --retry 4 --retry-delay 15 --retry-all-errors \
            --max-time 120 \
            "https://atlaswatch-transcript.onrender.com/health"

      - name: Poll AtlasWatch sources
        env:
          ATLASWATCH_BASE_URL: ${{ vars.ATLASWATCH_BASE_URL || 'https://atlaswatch-intelligence.mugger-galas-5ruxfot.chatgpt.site' }}
          COLLECTOR_SECRET: ${{ secrets.ATLASWATCH_COLLECTOR_SECRET }}
          SITES_BYPASS_TOKEN: ${{ secrets.ATLASWATCH_SITES_BYPASS_TOKEN }}
        run: |
          test -n "$COLLECTOR_SECRET"
          EXTRA_HEADERS=()
          if [ -n "$SITES_BYPASS_TOKEN" ]; then
            EXTRA_HEADERS+=(--header "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN")
          fi
          curl --fail --show-error --silent \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 300 \
            --request POST \
            --header "Authorization: Bearer $COLLECTOR_SECRET" \
            "${EXTRA_HEADERS[@]}" \
            "${ATLASWATCH_BASE_URL%/}/api/jobs/sources"
